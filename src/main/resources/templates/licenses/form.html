<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Generate key · Mvelelo Licensing</title></head>
<body>
<section>
    <h1 class="h3 mb-4">Generate license key</h1>

    <form method="post" th:action="@{/admin/licenses}" th:object="${form}" class="card card-body" style="max-width:560px">
        <div class="mb-3">
            <label class="form-label">Customer</label>
            <select class="form-select" th:field="*{customerId}">
                <option th:value="${null}">— none (e.g. internal) —</option>
                <option th:each="c : ${customers.content}" th:value="${c.id}" th:text="${c.orgName}">Org</option>
            </select>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Product</label>
                <select class="form-select" th:field="*{product}">
                    <option th:each="p : ${products}" th:value="${p}" th:text="${p}">P</option>
                </select>
            </div>
            <div class="col mb-3">
                <label class="form-label">Type</label>
                <select class="form-select" th:field="*{type}">
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}">T</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Max machines</label>
                <input class="form-control" type="number" min="1" th:field="*{maxMachines}">
            </div>
            <div class="col mb-3">
                <label class="form-label">Expires on <span class="text-muted">(blank = never / perpetual)</span></label>
                <input class="form-control" type="date" th:field="*{expiresOn}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Notes</label>
            <input class="form-control" th:field="*{notes}">
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary">Generate</button>
            <a class="btn btn-outline-secondary" href="/admin/licenses">Cancel</a>
        </div>
    </form>
</section>
</body>
</html>
