<!DOCTYPE html>
<html th:fragment="page(pageTitle, content)" lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${pageTitle}">Mvelelo Licensing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body{font-size:.925rem} .table td,.table th{vertical-align:middle}</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="/admin">Mvelelo&nbsp;Licensing</a>
    <div class="navbar-nav me-auto">
        <a class="nav-link" href="/admin/customers">Customers</a>
        <a class="nav-link" href="/admin/licenses">Licenses</a>
        <a class="nav-link" href="/admin/agents" sec:authorize="hasRole('SUPER_ADMIN')">Agents</a>
        <a class="nav-link" href="/admin/audit">Audit</a>
    </div>
    <span class="navbar-text text-white-50 me-3" th:text="${me != null ? me.displayName() : ''}">—</span>
    <form th:action="@{/logout}" method="post">
        <button class="btn btn-sm btn-outline-light">Log out</button>
    </form>
</nav>
<main class="container py-4">
    <div th:if="${flash}" class="alert alert-success" th:text="${flash}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:replace="${content}">content</div>
</main>
</body>
</html>
