<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Mvelelo Licensing</title>
    <link rel="icon" href="/img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
    <div class="login-card text-center">
        <img class="login-logo" src="/img/logo.png" alt="Mvelelo">
        <h1 class="h5 fw-bold mb-1">Product management portal</h1>
        <p class="text-muted mb-4">Sign in to continue</p>

        <div th:if="${param.error}" class="alert alert-danger py-2">Wrong email or password.</div>
        <div th:if="${param.logout}" class="alert alert-success py-2">You have been signed out.</div>

        <form th:action="@{/login}" method="post" class="card card-body shadow-sm text-start p-4">
            <label class="form-label">Email</label>
            <input class="form-control mb-3" type="email" name="username" required autofocus>
            <label class="form-label">Password</label>
            <input class="form-control mb-4" type="password" name="password" required>
            <button class="btn btn-primary w-100 py-2">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
