<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Mvelelo Licensing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:380px;margin-top:12vh">
    <h1 class="h4 mb-1">Mvelelo Licensing</h1>
    <p class="text-muted mb-4">Product management portal</p>

    <div th:if="${param.error}" class="alert alert-danger py-2">Wrong email or password.</div>
    <div th:if="${param.logout}" class="alert alert-info py-2">You have been signed out.</div>

    <form th:action="@{/login}" method="post" class="card card-body shadow-sm">
        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email" name="username" required autofocus>
        <label class="form-label">Password</label>
        <input class="form-control mb-3" type="password" name="password" required>
        <button class="btn btn-primary w-100">Sign in</button>
    </form>
</div>
</body>
</html>
