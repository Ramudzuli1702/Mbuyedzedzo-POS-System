<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Agents · Mvelelo Licensing</title></head>
<body>
<section>
    <h1 class="h3 mb-4">Sales agents</h1>

    <form method="post" th:action="@{/admin/agents}" class="card card-body mb-4" style="max-width:560px">
        <h2 class="h6">Add an agent</h2>
        <div class="row g-2">
            <div class="col"><input class="form-control" name="fullName" placeholder="Full name" required></div>
            <div class="col"><input class="form-control" type="email" name="email" placeholder="Email" required></div>
        </div>
        <div class="row g-2 mt-1">
            <div class="col"><input class="form-control" type="password" name="password" placeholder="Temp password" required></div>
            <div class="col-auto"><button class="btn btn-primary">Add</button></div>
        </div>
    </form>

    <table class="table bg-white">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="a : ${agents}">
            <td th:text="${a.fullName}">—</td>
            <td th:text="${a.email}">—</td>
            <td th:text="${a.role}">—</td>
            <td th:text="${a.active} ? 'Active' : 'Disabled'">—</td>
            <td th:if="${a.role.name() == 'SALES_AGENT'}">
                <form method="post" th:action="@{'/admin/agents/' + ${a.id} + '/toggle'}" class="d-inline">
                    <input type="hidden" name="active" th:value="${!a.active}">
                    <button class="btn btn-sm btn-outline-secondary"
                            th:text="${a.active} ? 'Deactivate' : 'Activate'">Toggle</button>
                </form>
                <form method="post" th:action="@{'/admin/agents/' + ${a.id} + '/reset-password'}" class="d-inline ms-1">
                    <input type="hidden" name="password" value="changeme">
                    <button class="btn btn-sm btn-outline-secondary"
                            onclick="return confirm('Reset password to \'changeme\'?')">Reset pw</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
