<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Customers · Mvelelo Licensing</title></head>
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Customers</h1>
        <a class="btn btn-primary" href="/admin/customers/new">New customer</a>
    </div>

    <form class="mb-3" method="get">
        <div class="input-group" style="max-width:420px">
            <input class="form-control" name="q" th:value="${q}" placeholder="Search org / contact / email">
            <button class="btn btn-outline-secondary">Search</button>
        </div>
    </form>

    <table class="table bg-white">
        <thead><tr><th>Organisation</th><th>Contact</th><th>Email</th><th>Phone</th></tr></thead>
        <tbody>
        <tr th:each="c : ${customers.content}">
            <td><a th:href="@{'/admin/customers/' + ${c.id}}" th:text="${c.orgName}">Org</a></td>
            <td th:text="${c.contactName}">Contact</td>
            <td th:text="${c.email}">email</td>
            <td th:text="${c.phone}">—</td>
        </tr>
        <tr th:if="${customers.isEmpty()}"><td colspan="4" class="text-muted">No customers.</td></tr>
        </tbody>
    </table>

    <nav th:if="${customers.totalPages > 1}">
        <span class="text-muted" th:text="'Page ' + (${customers.number} + 1) + ' of ' + ${customers.totalPages}"></span>
    </nav>
</section>
</body>
</html>
