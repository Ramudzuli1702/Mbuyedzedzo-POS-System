server:
  port: 8080

spring:
  datasource:
    # Uses your existing MySQL. Create the database once:  CREATE DATABASE mvelelo_licensing;
    # Override host/port/user/password with env vars if needed.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mvelelo_licensing}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

# ── License token signing ────────────────────────────────────────────────
# RS256. dev-keys/ holds a committed throwaway pair so the demo is
# reproducible; its PUBLIC half is also bundled in the desktop POS at
# src/main/resources/license-public.pem. For production, generate a fresh
# pair and pass LICENSE_PRIVATE_KEY / LICENSE_PUBLIC_KEY (and re-bundle the
# public key in the POS build).
licensing:
  token:
    issuer: mvelelo-licensing
    ttl-days: 7                # short-lived; desktop re-validates before this
    private-key-path: ${LICENSE_PRIVATE_KEY:dev-keys/license-private.pem}
    public-key-path:  ${LICENSE_PUBLIC_KEY:dev-keys/license-public.pem}
  trial:
    days: 30
    max-per-machine: 1
  bootstrap-admin:            # created on first run if no admin exists
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@mvelelo.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:changeme}

logging:
  level:
    org.flywaydb: info
