server:
  port: 8080

spring:
  datasource:
    # Uses your existing MySQL. Create the database once:  CREATE DATABASE mvelelo_licensing;
    # Override host/port/user/password with env vars if needed.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mvelelo_licensing}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

# ── License token signing ────────────────────────────────────────────────
# RSA private key (PKCS#8, PEM) used to sign activation tokens. The matching
# PUBLIC key is bundled inside the desktop POS. Generate a dev pair with:
#   openssl genpkey -algorithm RSA -pkcs8 -out license-private.pem -pkeyopt rsa_keygen_bits:2048
#   openssl rsa -pubout -in license-private.pem -out license-public.pem
licensing:
  token:
    issuer: mvelelo-licensing
    ttl-days: 7                # short-lived; desktop re-validates before this
    private-key-path: ${LICENSE_PRIVATE_KEY:config/license-private.pem}
    public-key-path:  ${LICENSE_PUBLIC_KEY:config/license-public.pem}
  trial:
    days: 30
    max-per-machine: 1
  bootstrap-admin:            # created on first run if no admin exists
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@mvelelo.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:changeme}

logging:
  level:
    org.flywaydb: info
