# OPTIONAL — only if you don't want to install SQL Server locally.
# By default the app connects to a local SQL Server on :1433 (see
# application.yml). Unlike MySQL's image, this one doesn't auto-create a
# named database — once it's up, create one:
#   docker exec -it <container> /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
#     -P 'YourStrong!Passw0rd' -C -Q "CREATE DATABASE mbuyedzedzo_licensing;"
#
# Then start the app with:
#   DB_USER=sa DB_PASSWORD='YourStrong!Passw0rd' DB_ENCRYPT=false mvn spring-boot:run
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - licensing-db:/var/opt/mssql

volumes:
  licensing-db:
