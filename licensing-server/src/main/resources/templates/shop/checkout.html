<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shop-layout :: page(~{::title}, ~{::main})}">
<head><title>Checkout &middot; Mbuyedzedzo</title></head>
<body>
<main>
    <div class="container py-5" style="max-width: 480px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-1" th:text="${productName}">Product</h3>
                <p class="text-muted mb-3" th:text="${type.name() == 'SUBSCRIPTION'} ? 'Monthly subscription' : 'Perpetual licence'">Licence type</p>
                <div class="price-tag mb-4" th:text="'R' + ${#numbers.formatDecimal(price, 1, 2)}">R0</div>

                <form th:action="@{/buy}" method="post">
                    <input type="hidden" name="product" th:value="${product}">
                    <input type="hidden" name="type" th:value="${type}">

                    <label class="form-label">Full name</label>
                    <input class="form-control mb-3" type="text" name="name" required autofocus>

                    <label class="form-label">Email address</label>
                    <input class="form-control mb-4" type="email" name="email" required>
                    <div class="form-text mb-3">Your licence key is sent here.</div>

                    <button class="btn w-100 py-2 text-white" style="background:#0f766e;">
                        Continue to payment
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
