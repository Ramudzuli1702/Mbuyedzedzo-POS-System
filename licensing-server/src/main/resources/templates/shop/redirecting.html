<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shop-layout :: page(~{::title}, ~{::main})}">
<head><title>Redirecting to PayFast&hellip; &middot; Mbuyedzedzo</title></head>
<body>
<main>
    <div class="container py-5 text-center">
        <div class="spinner-border text-success mb-3" role="status"></div>
        <p class="text-muted">Redirecting you to PayFast to complete payment&hellip;</p>
        <form id="payfast-form" th:action="${processUrl}" method="post">
            <input th:each="f : ${fields}" type="hidden" th:name="${f.key}" th:value="${f.value}">
        </form>
        <noscript><p>JavaScript is disabled — click below to continue.</p>
            <button onclick="document.getElementById('payfast-form').submit()" class="btn btn-success">Continue to PayFast</button>
        </noscript>
    </div>
    <script>document.getElementById('payfast-form').submit();</script>
</main>
</body>
</html>
