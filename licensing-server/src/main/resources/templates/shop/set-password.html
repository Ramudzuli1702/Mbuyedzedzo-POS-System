<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shop-layout :: page(~{::title}, ~{::main})}">
<head><title>Set up your account &middot; Mbuyedzedzo</title></head>
<body>
<main>
    <div class="container py-5" style="max-width: 420px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3">Set up your account</h3>
                <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
                <form th:action="@{/account/set-password}" method="post">
                    <input type="hidden" name="token" th:value="${token}">
                    <label class="form-label">Password</label>
                    <input class="form-control mb-3" type="password" name="password" minlength="8" required autofocus>
                    <label class="form-label">Confirm password</label>
                    <input class="form-control mb-4" type="password" name="confirm" minlength="8" required>
                    <button class="btn w-100 py-2 text-white" style="background:#0f766e;">Set password</button>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
