<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page(~{::title}, ~{::section})}">
<head><title>Audit log · Mbuyedzedzo Licensing</title></head>
<body>
<section>
    <div class="page-header"><div><h1>Audit log</h1><div class="sub">Every issue, activation, revoke and transfer</div></div></div>

    <div class="card">
        <table class="table">
            <thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead>
            <tbody>
            <tr th:each="e : ${entries.content}">
                <td class="text-nowrap" th:text="${@fmt.datetime(e.at)}">—</td>
                <td th:text="${e.actor}">—</td>
                <td><span class="badge s-muted" th:text="${e.action}">—</span></td>
                <td><code th:text="${e.target}">—</code></td>
                <td th:text="${e.detail}">—</td>
            </tr>
            <tr th:if="${entries.isEmpty()}"><td colspan="5" class="text-muted">Nothing logged yet.</td></tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
