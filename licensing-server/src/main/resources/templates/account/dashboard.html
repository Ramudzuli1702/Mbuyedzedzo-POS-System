<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shop-layout :: page(~{::title}, ~{::main})}">
<head><title>My account &middot; Mbuyedzedzo</title></head>
<body>
<main>
    <div class="container py-5" style="max-width: 760px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-0" th:text="'Hi, ' + ${me.displayName()}">Hi</h3>
                <p class="text-muted mb-0" th:text="${me.email()}">email</p>
            </div>
            <form th:action="@{/account/logout}" method="post">
                <button class="btn btn-outline-secondary btn-sm">Sign out</button>
            </form>
        </div>

        <div th:if="${param.requested}" class="alert alert-success py-2">
            Transfer requested. An admin will review it shortly.
        </div>
        <div th:if="${param.error}" class="alert alert-danger py-2">That licence couldn't be found.</div>

        <div th:if="${licenses.isEmpty()}" class="text-muted">No licences on this account yet.</div>

        <div th:each="lic : ${licenses}" class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <div class="fw-bold" th:text="${lic.product.name() == 'POS_RETAIL'} ? 'Mbuyedzedzo Retail POS' : 'Mbuyedzedzo POS System'">Product</div>
                        <div class="font-monospace small text-muted" th:text="${lic.licenseKey}">KEY</div>
                    </div>
                    <span class="badge"
                          th:classappend="${lic.status.name() == 'ACTIVE'} ? 'bg-success' : (${lic.status.name() == 'REVOKED' or lic.status.name() == 'SUSPENDED'} ? 'bg-danger' : 'bg-secondary')"
                          th:text="${lic.status}">STATUS</span>
                </div>

                <hr>

                <div class="row small text-muted">
                    <div class="col-6">
                        <div><strong>Type:</strong> <span th:text="${lic.type}">TYPE</span></div>
                        <div th:if="${lic.expiresAt != null}">
                            <strong>Expires:</strong>
                            <span th:text="${#temporals.format(lic.expiresAt, 'dd MMM yyyy')}">date</span>
                        </div>
                        <div th:if="${lic.expiresAt == null}"><strong>Expires:</strong> never (perpetual)</div>
                    </div>
                    <div class="col-6">
                        <div th:if="${activationByLicense.containsKey(lic.id)}">
                            <strong>Activated on:</strong>
                            <span th:text="${activationByLicense.get(lic.id).machineLabel} ?: 'this machine'">machine</span>
                        </div>
                        <div th:unless="${activationByLicense.containsKey(lic.id)}">Not yet activated</div>
                    </div>
                </div>

                <div class="mt-3" th:if="${activationByLicense.containsKey(lic.id)}">
                    <div th:with="req=${requestsByLicense.get(lic.id)}">
                        <span th:if="${req != null and req.status.name() == 'PENDING'}" class="badge bg-warning text-dark">
                            Transfer requested, awaiting admin approval
                        </span>
                        <form th:if="${req == null or req.status.name() != 'PENDING'}"
                              th:action="@{'/account/licenses/' + ${lic.id} + '/request-transfer'}" method="post"
                              class="d-flex gap-2">
                            <input type="text" name="reason" class="form-control form-control-sm"
                                   placeholder="Reason (optional), e.g. got a new PC" style="max-width: 320px;">
                            <button class="btn btn-outline-secondary btn-sm">Request transfer to a new PC</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
