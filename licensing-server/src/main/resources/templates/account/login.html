<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/shop-layout :: page(~{::title}, ~{::main})}">
<head><title>Sign in &middot; Mbuyedzedzo</title></head>
<body>
<main>
    <div class="container py-5" style="max-width: 420px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-1">My account</h3>
                <p class="text-muted mb-3">Manage your Mbuyedzedzo licences</p>

                <div th:if="${param.setupComplete}" class="alert alert-success py-2">
                    Your account is ready — sign in below.
                </div>
                <div th:if="${param.error}" class="alert alert-danger py-2">Wrong email or password.</div>
                <div th:if="${param.logout}" class="alert alert-success py-2">You have been signed out.</div>

                <form th:action="@{/account/login}" method="post">
                    <label class="form-label">Email</label>
                    <input class="form-control mb-3" type="email" name="username" required autofocus>
                    <label class="form-label">Password</label>
                    <input class="form-control mb-4" type="password" name="password" required>
                    <button class="btn w-100 py-2 text-white" style="background:#0f766e;">Sign in</button>
                </form>
                <p class="text-muted small mt-3 mb-0">
                    No account yet? It's set up automatically from the link emailed with your licence key.
                </p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
